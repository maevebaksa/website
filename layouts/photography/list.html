{{ define "main" }}
<main class="mb-photo">
  <header class="mb-photo-nav">
    <a class="mb-photo-exit" href="{{ site.Home.RelPermalink }}">← BACK TO SITE</a>
    <span class="mb-photo-section">PHOTOGRAPHY</span>
    <span class="mb-photo-brand">MAEVE BAKSA</span>
  </header>

  {{ $photos := hugo.Data.photography.photo }}
  {{ if $photos }}
  <section class="mb-photo-stage" aria-label="Photography gallery">
    {{ range $i, $photo := $photos }}
    <figure class="mb-photo-slide">
      <img src="{{ $photo.src | relURL }}" alt="{{ $photo.alt }}" loading="{{ if eq $i 0 }}eager{{ else }}lazy{{ end }}" decoding="async">
      {{ with $photo.caption }}<figcaption>{{ . }}</figcaption>{{ end }}
    </figure>
    {{ end }}
  </section>
  {{ else }}
  <section class="mb-photo-empty">
    <div>
      <h1>Photography</h1>
      <div class="mb-photo-copy">{{ .Content }}</div>
    </div>
  </section>
  {{ end }}

  <footer class="mb-photo-footer">
    <span>© {{ now.Year }} Maeve Baksa</span>
  </footer>
</main>
{{ end }}
