media:
  - name: site_images
    label: Site images
    input: static/images
    output: images
    categories: [image]
    rename: safe

settings:
  content:
    merge: true
  commit:
    identity: user

content:
  - name: projects
    label: Portfolio projects
    type: collection
    path: content/projects
    format: yaml-frontmatter
    exclude: ["_index.md"]
    subfolders: false
    filename:
      template: "{primary}.md"
      field: create
    view:
      primary: title
      fields: [title, type, year]
      sort: [weight, title]
      default:
        sort: weight
        order: asc
    fields:
      - name: title
        label: Project name
        type: string
        required: true
      - name: slug
        label: URL slug
        type: string
        description: Optional. Leave blank to use the filename.
      - name: weight
        label: Portfolio order
        type: number
        required: true
      - name: description
        label: Summary
        type: text
        required: true
      - name: type
        label: Machine / project type
        type: string
      - name: year
        label: Period
        type: string
      - name: image
        label: Hero image
        type: image
        options:
          media: site_images
          rename: safe
      - name: alt
        label: Image alt text
        type: string
      - name: domain
        label: Domain
        type: string
      - name: status
        label: Status
        type: string
      - name: aliases
        label: Old URLs
        type: string
        list: true
      - name: tags
        label: Tags
        type: string
        list: true
      - name: body
        label: Project write-up
        type: rich-text
        options:
          media: false
          switcher: true

  - name: notes
    label: Technical notes
    type: collection
    path: content/notes
    format: yaml-frontmatter
    exclude: ["_index.md"]
    filename:
      template: "{primary}.md"
      field: create
    view:
      primary: title
      fields: [title, date]
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        type: string
        required: true
      - name: date
        type: date
        options:
          format: yyyy-MM-dd
      - name: description
        type: text
      - name: tags
        type: string
        list: true
      - name: categories
        type: string
        list: true
      - name: aliases
        type: string
        list: true
      - name: body
        type: rich-text
        options:
          media: false
          switcher: true

  - name: pages
    label: Main pages
    type: group
    items:
      - name: about
        label: About
        type: file
        path: content/about.md
        format: yaml-frontmatter
        operations:
          delete: false
        fields:
          - name: title
            type: string
          - name: description
            type: text
          - name: body
            type: rich-text
            options:
              media: false
              switcher: true
      - name: contact
        label: Contact
        type: file
        path: content/contact.md
        format: yaml-frontmatter
        operations:
          delete: false
        fields:
          - name: title
            type: string
          - name: description
            type: text
          - name: body
            type: rich-text
            options:
              media: false
              switcher: true
      - name: cv
        label: CV
        type: file
        path: content/cv.md
        format: yaml-frontmatter
        operations:
          delete: false
        fields:
          - name: title
            type: string
          - name: description
            type: text
          - name: body
            type: rich-text
            options:
              media: false
              switcher: true

  - name: photography
    label: Photography
    type: file
    path: data/photography.toml
    format: toml
    operations:
      delete: false
    fields:
      - name: photo
        label: Photos
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{caption}"
        fields:
          - name: src
            label: Image
            type: image
            required: true
            options:
              media: site_images
              path: photography
              rename: safe
          - name: alt
            label: Alt text
            type: string
            required: true
          - name: caption
            label: Caption
            type: string

  - name: hugo_config
    label: Hugo configuration
    type: file
    path: hugo.toml
    format: code
    operations:
      delete: false
